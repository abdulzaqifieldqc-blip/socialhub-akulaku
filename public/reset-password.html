<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atur Password — SocialHub Akulaku</title><link rel="stylesheet" href="/styles.css"></head>
<body><main><div class="card auth"><h2>Atur password baru</h2>
<p class="muted">Masukkan password baru minimal 12 karakter.</p>
<form id="reset-form"><label>Password baru<input id="new-password" type="password" minlength="12" required autocomplete="new-password"></label>
<label>Ulangi password<input id="confirm-password" type="password" minlength="12" required autocomplete="new-password"></label>
<button class="btn red wide mt" id="submit">Simpan password</button><p id="message" class="msg"></p></form>
<p class="small"><a href="/">Kembali ke SocialHub</a></p></div></main><script src="/reset-password.js"></script></body></html>
